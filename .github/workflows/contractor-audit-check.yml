name: Contractor audit check
on:
  push:
    branches:
      - fix/contractor-final-audit
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply contractor audit fixes
        run: |
          python3 scripts/fix_contractor_audit.py
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src
            git commit -m "Corrige flujos finales del portal contratista"
            git push
          fi
      - name: Audit legacy contractor patterns
        run: |
          echo '--- simulated uploads ---'
          ! grep -Rni "subirDocumentoRequisito\|fechaCargaDemo" src/pages/Contratista.tsx src/pages/contratista src/components/Contratista* || exit 1
          echo '--- hardcoded demo entities/projects ---'
          grep -RniE "costanera|mackenna|tecnicosur|eléctrica sur|constructora.velez|servicios norte" src/pages/Contratista.tsx src/pages/contratista src/components/Contratista* || true
          echo '--- browser localStorage in contractor flow ---'
          grep -Rni "localStorage" src/pages/Contratista.tsx src/pages/contratista src/components/Contratista* || true
          echo '--- demo/todo markers ---'
          grep -RniE "demo|TODO|FIXME" src/pages/Contratista.tsx src/pages/contratista src/components/Contratista* || true
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm audit --omit=dev

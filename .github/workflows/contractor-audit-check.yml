name: Contractor audit check
on:
  push:
    branches:
      - fix/contractor-final-audit
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply contractor audit fixes
        run: |
          python3 scripts/fix_contractor_audit.py
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src
            git commit -m "Corrige flujos finales del portal contratista"
            git push
          fi
      - name: Ensure simulated worker upload is gone
        run: |
          if grep -R "subirDocumentoRequisito" src --exclude='documentosUtils.ts'; then
            echo "Legacy simulated upload still referenced"
            exit 1
          fi
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm audit --omit=dev

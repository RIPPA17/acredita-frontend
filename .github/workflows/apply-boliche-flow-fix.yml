name: Build Boliche flow fix

on:
  push:
    branches:
      - ux/final-visual-normalization

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply targeted fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          ui = Path('src/pages/contratista/DocumentRequirementsTab.tsx')
          text = ui.read_text()
          old = "  if (!item.doc) return { label: 'Subir', cls: 'doc-btn-primary' };"
          new = "  if (!item.doc || item.estado === 'Pendiente') return { label: 'Subir', cls: 'doc-btn-primary' };"
          assert old in text, 'accionDoc target not found'
          ui.write_text(text.replace(old, new, 1))

          sync = Path('src/data/supabaseOperationalData.ts')
          text = sync.read_text()
          old_worker = "        const matchingDocument = obligation ? docs.find(item => item.obligacionId === obligation.id) : undefined;"
          new_worker = """        const matchingDocument = obligation
          ? docs.find(item => item.obligacionId === obligation.id)
          : docs.find(item =>
              item.proyectoId === projectKey
              && normalize(item.nombre) === normalize(req.nombre)
              && !item.obligacionId
            );"""
          assert old_worker in text, 'worker matching target not found'
          text = text.replace(old_worker, new_worker, 1)

          old_company = "        const matchingDocument = obligation ? companyDocs.find(item => item.obligacionId === obligation.id) : undefined;"
          new_company = """        const matchingDocument = obligation
          ? companyDocs.find(item => item.obligacionId === obligation.id)
          : companyDocs.find(item =>
              item.proyectoId === projectKey
              && normalize(item.nombre) === normalize(req.nombre)
              && !item.obligacionId
            );"""
          assert old_company in text, 'company matching target not found'
          sync.write_text(text.replace(old_company, new_company, 1))

          test = Path('tests/e2e/el-boliche-terrible-de-pollo.spec.ts')
          text = test.read_text()
          old_test = "  await expect(page.getByText('F30 SII (mes vigente)').first()).toBeVisible();\n  await expect(page.getByText('Documento ilegible').first()).toBeVisible();"
          new_test = "  await expect(page.getByText('F30 SII (mes vigente)').first()).toBeVisible();\n  await page.getByText('F30 SII (mes vigente)').first().click();\n  await expect(page.getByText('Documento ilegible').first()).toBeVisible();"
          assert old_test in text, 'rejection detail test target not found'
          test.write_text(text.replace(old_test, new_test, 1))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: boliche-flow-fix
          path: |
            src/pages/contratista/DocumentRequirementsTab.tsx
            src/data/supabaseOperationalData.ts
            tests/e2e/el-boliche-terrible-de-pollo.spec.ts

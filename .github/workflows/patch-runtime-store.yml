name: Patch runtime store

on:
  push:
    branches: [feat/remove-business-localstorage]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'Elimina localStorage como fuente de negocio') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/remove-business-localstorage
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Patch data architecture
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def replace_once(text, pattern, replacement, label, flags=0):
              new, count = re.subn(pattern, replacement, text, count=1, flags=flags)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 replacement, got {count}')
              return new

          runtime = '''const runtimeData = new Map<string, unknown>();

export const CORE_RUNTIME_KEYS = [
  'acredita_mandantes',
  'acredita_proyectos',
  'acredita_contratistas',
  'acredita_requisitos',
] as const;

const LEGACY_BUSINESS_KEYS = [
  'acredita_db_initialized',
  'acredita_schema_version',
  'acredita_mandantes',
  'acredita_proyectos',
  'acredita_contratistas',
  'acredita_requisitos',
  'acredita_invitaciones',
  'acredita_audit_logs',
] as const;

export function getRuntimeArray<T>(key: string, fallback: T[] = []): T[] {
  const value = runtimeData.get(key);
  return Array.isArray(value) ? value as T[] : fallback;
}

export function setRuntimeArray<T>(key: string, value: T[]): void {
  runtimeData.set(key, value);
}

export function clearRuntimeBusinessData(): void {
  CORE_RUNTIME_KEYS.forEach(key => runtimeData.delete(key));
}

export function runtimeFingerprint(keys: readonly string[]): string {
  return keys.map(key => `${key}:${JSON.stringify(runtimeData.get(key) ?? null)}`).join('|');
}

export function purgeLegacyBusinessStorage(): void {
  if (typeof window === 'undefined') return;
  LEGACY_BUSINESS_KEYS.forEach(key => localStorage.removeItem(key));
  for (let i = localStorage.length - 1; i >= 0; i -= 1) {
    const key = localStorage.key(i);
    if (!key) continue;
    if (key.startsWith('acredita_core_supabase_migrated_v1:') || key.startsWith('acredita_operational_supabase_migrated_v1:')) {
      localStorage.removeItem(key);
    }
  }
}
'''
          Path('src/data/runtimeDataStore.ts').write_text(runtime, encoding='utf-8')

          # localStorageDb: core business getters/savers become memory-backed.
          p = Path('src/data/localStorageDb.ts')
          s = p.read_text(encoding='utf-8')
          anchor = "import { backendAccreditationLabel, clearDerivedStateCache, getBackendAccreditationState, getBackendWorkerStateForProject } from './supabaseDerivedState';\n"
          if "./runtimeDataStore" not in s:
              s = s.replace(anchor, anchor + "import { clearRuntimeBusinessData, getRuntimeArray, setRuntimeArray } from './runtimeDataStore';\n")
          s = replace_once(
              s,
              r"export function initDb\(\) \{\n  if \(typeof window === 'undefined'\) return;\n  seedIfNeeded\(\);\n  runMigrations\(\);\n\}",
              "export function initDb() {\n  // Los datos de negocio ya no se inicializan ni se leen desde localStorage.\n  // ProtectedRoute hidrata la memoria efímera desde Supabase antes de renderizar portales protegidos.\n}",
              'initDb'
          )
          s = replace_once(
              s,
              r"export function getContratistas\(\): Contratista\[\] \{.*?\n\}\n\nfunction snapshotContractorStates",
              "export function getContratistas(): Contratista[] {\n  return getRuntimeArray<Contratista>('acredita_contratistas', []);\n}\n\nfunction snapshotContractorStates",
              'getContratistas',
              re.S
          )
          s = replace_once(
              s,
              r"export function saveContratistas\(data: Contratista\[\]\) \{.*?\n\}\n\nexport function getProyectos",
              "export function saveContratistas(data: Contratista[]) {\n  setRuntimeArray('acredita_contratistas', data);\n}\n\nexport function getProyectos",
              'saveContratistas',
              re.S
          )
          s = replace_once(
              s,
              r"export function getProyectos\(\): Proyecto\[\] \{.*?export function saveMandantes\(data: Mandante\[\]\) \{.*?\n\}",
              "export function getProyectos(): Proyecto[] {\n  return getRuntimeArray<Proyecto>('acredita_proyectos', []);\n}\n\nexport function saveProyectos(data: Proyecto[]) {\n  setRuntimeArray('acredita_proyectos', data);\n}\n\nexport function getMandantes(): Mandante[] {\n  return getRuntimeArray<Mandante>('acredita_mandantes', []);\n}\n\nexport function saveMandantes(data: Mandante[]) {\n  setRuntimeArray('acredita_mandantes', data);\n}",
              'projects/mandantes',
              re.S
          )
          s = replace_once(
              s,
              r"export function getRequisitos\(\): Requisito\[\] \{.*?\n\}\n\nexport function saveRequisitos\(data: Requisito\[\]\) \{.*?\n\}",
              "export function getRequisitos(): Requisito[] {\n  return getRuntimeArray<Requisito>('acredita_requisitos', []);\n}\n\nexport function saveRequisitos(data: Requisito[]) {\n  setRuntimeArray('acredita_requisitos', data);\n}",
              'requirements',
              re.S
          )
          s = s.replace("  ACREDITA_DATA_KEYS.forEach(key => localStorage.removeItem(key));\n  initDb();", "  ACREDITA_DATA_KEYS.forEach(key => localStorage.removeItem(key));\n  clearRuntimeBusinessData();")
          s = s.replace("  ACREDITA_DATA_KEYS.forEach(key => localStorage.removeItem(key));\n  localStorage.removeItem('acredita_session');", "  ACREDITA_DATA_KEYS.forEach(key => localStorage.removeItem(key));\n  clearRuntimeBusinessData();\n  localStorage.removeItem('acredita_session');")
          p.write_text(s, encoding='utf-8')

          # Core: hydrate/push against runtime memory, never persistent browser business data.
          p = Path('src/data/supabaseCoreData.ts')
          s = p.read_text(encoding='utf-8')
          auth_anchor = "import type { SupabaseUserSession } from './supabaseAuth';\n"
          if "./runtimeDataStore" not in s:
              s = s.replace(auth_anchor, auth_anchor + "import { getRuntimeArray, purgeLegacyBusinessStorage, runtimeFingerprint, setRuntimeArray } from './runtimeDataStore';\n")
          s = re.sub(r"const MIGRATION_MARKER_PREFIX = 'acredita_core_supabase_migrated_v1:';\n", "", s)
          s = replace_once(
              s,
              r"function readArray<T>\(key: string, fallback: T\[\] = \[\]\): T\[\] \{.*?\n\}\n\nfunction writeArray\(key: string, data: unknown\[\]\): void \{.*?\n\}",
              "function readArray<T>(key: string, fallback: T[] = []): T[] {\n  return getRuntimeArray<T>(key, fallback);\n}\n\nfunction writeArray(key: string, data: unknown[]): void {\n  setRuntimeArray(key, data);\n}",
              'core runtime wrappers',
              re.S
          )
          s = s.replace("  localStorage.setItem('acredita_db_initialized', 'true');\n", "")
          s = replace_once(
              s,
              r"function coreFingerprint\(\): string \{.*?\n\}",
              "function coreFingerprint(): string {\n  return runtimeFingerprint(CORE_KEYS);\n}",
              'core fingerprint',
              re.S
          )
          s = replace_once(
              s,
              r"export async function prepareCoreDataForSession\(session: SupabaseUserSession\): Promise<void> \{.*?\n\}",
              "export async function prepareCoreDataForSession(session: SupabaseUserSession): Promise<void> {\n  if (typeof window === 'undefined') return;\n  purgeLegacyBusinessStorage();\n  await hydrateCoreDataFromSupabase(session);\n}",
              'prepare core',
              re.S
          )
          s = s.replace(
              "      await pushCoreDataToSupabase(session);\n    } catch (error)",
              "      await pushCoreDataToSupabase(session);\n      await hydrateCoreDataFromSupabase(session);\n      lastFingerprint = coreFingerprint();\n    } catch (error)"
          )
          p.write_text(s, encoding='utf-8')

          # Operational: use runtime memory; Supabase rows override any previous browser snapshot.
          p = Path('src/data/supabaseOperationalData.ts')
          s = p.read_text(encoding='utf-8')
          derived_anchor = "import { refreshDerivedStateCache } from './supabaseDerivedState';\n"
          if "./runtimeDataStore" not in s:
              s = s.replace(derived_anchor, derived_anchor + "import { getRuntimeArray, runtimeFingerprint, setRuntimeArray } from './runtimeDataStore';\n")
          s = re.sub(r"const MIGRATION_MARKER_PREFIX = 'acredita_operational_supabase_migrated_v1:';\n", "", s)
          s = replace_once(
              s,
              r"function readContractors\(\): Contratista\[\] \{.*?\n\}\n\nfunction writeContractors\(contractors: Contratista\[\]\): void \{.*?\n\}\n\nfunction readProjects\(\): Proyecto\[\] \{.*?\n\}\n\nfunction readRequirements\(\): Requisito\[\] \{.*?\n\}",
              "function readContractors(): Contratista[] {\n  return getRuntimeArray<Contratista>(CONTRACTORS_KEY, []);\n}\n\nfunction writeContractors(contractors: Contratista[]): void {\n  setRuntimeArray(CONTRACTORS_KEY, contractors);\n}\n\nfunction readProjects(): Proyecto[] {\n  return getRuntimeArray<Proyecto>('acredita_proyectos', []);\n}\n\nfunction readRequirements(): Requisito[] {\n  return getRuntimeArray<Requisito>('acredita_requisitos', []);\n}",
              'operational runtime wrappers',
              re.S
          )
          s = s.replace(
              "    const localContractor = contractors.find(c => c.id === contractorKey);\n    const localWorker = localContractor?.trabajadores?.find(w => normalizeRut(w.rut) === normalizeRut(backendWorker.rut));\n    let docs = mergeDocs(localWorker?.documentos || [], backendWorkerDocs.get(`${contractorKey}:${normalizeRut(backendWorker.rut)}`) || []);",
              "    const localContractor = contractors.find(c => c.id === contractorKey);\n    const localWorker = localContractor?.trabajadores?.find(w => normalizeRut(w.rut) === normalizeRut(backendWorker.rut));\n    let docs = [...(backendWorkerDocs.get(`${contractorKey}:${normalizeRut(backendWorker.rut)}`) || [])];"
          )
          s = s.replace(
              "      ...(localWorker || { estado: 'pendiente' as const }),\n      nombre: backendWorker.full_name,\n      rut: backendWorker.rut,\n      cargo: backendWorker.job_title || localWorker?.cargo,\n      faena: firstProject?.nombre || localWorker?.faena,\n      documentos: docs,",
              "      estado: 'pendiente' as const,\n      nombre: backendWorker.full_name,\n      rut: backendWorker.rut,\n      cargo: backendWorker.job_title || undefined,\n      faena: firstProject?.nombre,\n      documentos: docs,"
          )
          old_next = """  const next = contractors.map(contractor => ({
    ...contractor,
    documentos: mergeDocs(contractor.documentos || [], backendCompanyDocs.get(contractor.id) || []),
    trabajadores: workersByContractor.has(contractor.id)
      ? workersByContractor.get(contractor.id)
      : contractor.trabajadores,
  }));
"""
          new_next = """  const next = contractors.map(contractor => {
    const companyDocs = [...(backendCompanyDocs.get(contractor.id) || [])];
    for (const projectKey of contractor.proyectos || []) {
      const companyReqs = requirements.filter(r => r.proyectoId === projectKey && r.destino === 'empresa' && r.activo !== false);
      for (const req of companyReqs) {
        if (companyDocs.some(d => d.proyectoId === projectKey && normalize(d.nombre) === normalize(req.nombre))) continue;
        companyDocs.push({
          id: `doc_${slug(contractor.id)}_${slug(projectKey)}_${slug(req.id)}_empresa`,
          nombre: req.nombre,
          categoria: req.categoria,
          estado: 'pendiente',
          vencimiento: '—',
          proyectoId: projectKey,
          version: 1,
          historial: [],
        });
      }
    }
    return {
      ...contractor,
      documentos: companyDocs,
      trabajadores: workersByContractor.get(contractor.id) || [],
    };
  });
"""
          if old_next not in s:
              raise SystemExit('operational backend-only contractor merge block not found')
          s = s.replace(old_next, new_next)
          s = replace_once(
              s,
              r"export async function prepareOperationalDataForSession\(session: SupabaseUserSession\): Promise<void> \{.*?\n\}",
              "export async function prepareOperationalDataForSession(session: SupabaseUserSession): Promise<void> {\n  if (typeof window === 'undefined') return;\n  await hydrateOperationalDataFromSupabase(session);\n}",
              'prepare operational',
              re.S
          )
          s = replace_once(
              s,
              r"function operationalFingerprint\(\): string \{.*?\n\}",
              "function operationalFingerprint(): string {\n  return runtimeFingerprint([CONTRACTORS_KEY]);\n}",
              'operational fingerprint',
              re.S
          )
          s = s.replace(
              "      await pushOperationalDataToSupabase(session);\n    } catch (error)",
              "      await pushOperationalDataToSupabase(session);\n      await hydrateOperationalDataFromSupabase(session);\n      last = operationalFingerprint();\n    } catch (error)"
          )
          p.write_text(s, encoding='utf-8')

          # ProtectedRoute no longer needs legacy localStorage migration markers.
          p = Path('src/components/ProtectedRoute.tsx')
          s = p.read_text(encoding='utf-8')
          s = re.sub(
              r"\n        // Solo intentamos subir datos core legacy.*?localStorage\.setItem\(`acredita_core_supabase_migrated_v1:\$\{restored\.profileId\}`, 'true'\);\n        \}\n",
              "\n",
              s,
              count=1,
              flags=re.S,
          )
          p.write_text(s, encoding='utf-8')
          PY
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/patch-runtime-store.yml
          git add src/data/runtimeDataStore.ts src/data/localStorageDb.ts src/data/supabaseCoreData.ts src/data/supabaseOperationalData.ts src/components/ProtectedRoute.tsx
          git commit -m "Elimina localStorage como fuente de negocio"
          git push origin feat/remove-business-localstorage

name: Final cleanup check
on:
  push:
    branches:
      - cleanup/legacy-final
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm audit --omit=dev
      - name: Ensure no obsolete markers
        run: |
          ! grep -RInE --exclude-dir=node_modules --exclude-dir=__tests__ 'Datos demo|No existe backend|admin123|contratista123|mandante123|sembrarDocumentosEjemplo|acredita_audit_logs|acredita_invitaciones' src --exclude='runtimeDataStore.ts'

name: Point 3 Confirm Writes

on:
  push:
    branches:
      - fix/confirm-critical-writes

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/confirm-critical-writes
      - name: Patch critical writes
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path_str, old, new, label):
              path = Path(path_str)
              text = path.read_text()
              if old not in text:
                  raise SystemExit(f'{label} anchor not found in {path_str}')
              path.write_text(text.replace(old, new, 1))

          # Admin: proyecto + mandante esperan confirmación de Supabase.
          path = Path('src/pages/Admin.tsx')
          text = path.read_text()
          old = 'import { loadReadNotificationKeys, markNotificationKeysRead } from \'../data/supabaseNotifications\';'
          new = old + "\nimport { confirmBusinessPersistence } from '../data/supabasePersistence';"
          if 'confirmBusinessPersistence' not in text:
              text = text.replace(old, new, 1)

          old = '  const [showNuevoProyectoModal, setShowNuevoProyectoModal] = useState(false);\n  const [formNuevoProyecto, setFormNuevoProyecto] = useState({ nombre: "", mandanteId: "" });'
          new = old + '\n  const [creatingProject, setCreatingProject] = useState(false);\n  const [creatingMandante, setCreatingMandante] = useState(false);'
          text = text.replace(old, new, 1)

          start = text.index('  const handleCrearProyecto = (e: React.FormEvent) => {')
          end = text.index('\n\n\n  const hayAccesosFallidos', start)
          handler = '''  const handleCrearProyecto = async (e: React.FormEvent) => {
    e.preventDefault();
    const { nombre, mandanteId } = formNuevoProyecto;
    if (!nombre.trim() || !mandanteId || creatingProject) return;

    setCreatingProject(true);
    try {
      const nuevoProyecto: Proyecto = {
        id: `p_${Date.now()}`,
        nombre: nombre.trim(),
        mandanteId,
        estado: 'Activo',
        contratistas: [],
      };
      const listaProyectos = getProyectos();
      listaProyectos.push(nuevoProyecto);
      saveProyectos(listaProyectos);

      const listaMandantes = getMandantes();
      const mandante = listaMandantes.find(m => m.id === mandanteId);
      if (mandante && !mandante.proyectos.includes(nuevoProyecto.id)) {
        mandante.proyectos.push(nuevoProyecto.id);
        saveMandantes(listaMandantes);
      }

      await confirmBusinessPersistence('core');
      setProyectos([...getProyectos()]);
      resetFormNuevoProyecto();
      showToast('Proyecto creado correctamente');
    } catch (error) {
      setProyectos([...getProyectos()]);
      console.error('No fue posible crear el proyecto.', error);
      showToast('No fue posible guardar el proyecto. Intenta nuevamente.', 'error');
    } finally {
      setCreatingProject(false);
    }
  };'''
          text = text[:start] + handler + text[end:]

          old = '''                <form onSubmit={(event) => {
                  event.preventDefault();
                  const empresa = formInvitacion.empresa.trim();
                  const rut = formInvitacion.rut.trim();
                  if (!empresa || !rut) return;
                  const list = getMandantes();
                  if (list.some(item => item.rut.trim().toLowerCase() === rut.toLowerCase())) {
                    showToast('Ya existe un mandante con este RUT.', 'warning');
                    return;
                  }
                  list.push({ id: `m_${Date.now()}`, nombre: empresa, rut, proyectos: [] });
                  saveMandantes(list);
                  setMandanteCreado(true);
                }} className="flex flex-col gap-4">'''
          new = '''                <form onSubmit={async (event) => {
                  event.preventDefault();
                  const empresa = formInvitacion.empresa.trim();
                  const rut = formInvitacion.rut.trim();

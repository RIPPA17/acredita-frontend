                    console.error('No fue posible crear el mandante.', error);
                    showToast('No fue posible guardar el mandante. Intenta nuevamente.', 'error');
                  } finally {
                    setCreatingMandante(false);
                  }
                }} className="flex flex-col gap-4">'''

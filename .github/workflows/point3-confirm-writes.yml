          text = text[:start] + save_block + text[end:]
          text = text.replace('            <form onSubmit={guardarRequisito} className="p-6 flex flex-col gap-4">', '            <form onSubmit={guardarRequisito} className="p-6 flex flex-col gap-4">\n              {requirementSaveError && <div className="rounded-lg border border-red-200 bg-red-50 px-3 py-2 text-[12px] text-red-700">{requirementSaveError}</div>}', 1)
          text = text.replace('<button type="button" onClick={cerrarModalRequisito} className="btn btn-ghost font-medium">', '<button type="button" disabled={savingRequirement} onClick={cerrarModalRequisito} className="btn btn-ghost font-medium disabled:opacity-50">', 1)
          text = text.replace('                <button type="submit" className="btn btn-primary">\n                  {editingRequisito ? \'Guardar cambios\' : \'Agregar requisito\'}\n                </button>', '                <button type="submit" disabled={savingRequirement} className="btn btn-primary disabled:opacity-60 disabled:cursor-not-allowed">\n                  {savingRequirement ? \'Guardando…\' : editingRequisito ? \'Guardar cambios\' : \'Agregar requisito\'}\n                </button>', 1)
          path.write_text(text)
          PY

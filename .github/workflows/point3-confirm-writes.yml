name: Point 3 Confirm Writes

on:
  push:
    branches:
      - fix/confirm-critical-writes

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/confirm-critical-writes
      - name: Patch critical writes
        run: python .github/scripts/point3_patch.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/Admin.tsx src/pages/Contratista.tsx src/pages/Mandante.tsx src/pages/mandante/ProyectosTab.tsx src/pages/admin/ProyectoDetailDrawer.tsx
          git commit -m "Espera confirmación de Supabase en escrituras críticas"
          git push origin HEAD:fix/confirm-critical-writes

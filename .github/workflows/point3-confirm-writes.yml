                    showToast('Ya existe un mandante con este RUT.', 'warning');
                    return;
                  }
                  setCreatingMandante(true);
                  try {
                    list.push({ id: `m_${Date.now()}`, nombre: empresa, rut, proyectos: [] });
                    saveMandantes(list);
                    await confirmBusinessPersistence('core');
                    setMandanteCreado(true);

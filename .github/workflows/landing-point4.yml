name: Landing Point 4

on:
  push:
    branches:
      - fix/landing-no-fake-clients

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/landing-no-fake-clients
      - name: Aplicar limpieza
        run: python .github/scripts/landing_point4.py
      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/Landing.tsx
          git commit -m "Elimina clientes ficticios de la landing"
          git push origin HEAD:fix/landing-no-fake-clients

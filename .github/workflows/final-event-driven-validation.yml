name: Final event-driven validation

on:
  push:
    branches:
      - 'feat/event-driven-supabase-writes'

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Persist mandantes through the same event-driven path
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/data/supabaseCoreData.ts')
          s = p.read_text()
          if 'async function syncMandantes(' not in s:
              marker = 'async function syncContractors(\n'
              fn = '''async function syncMandantes(\n  session: SupabaseUserSession,\n  rows: CoreRows,\n  mandantes: Mandante[],\n): Promise<void> {\n  if (session.role !== 'admin') return;\n  const token = session._supabase.accessToken;\n  const backendByKey = new Map(rows.mandantes.filter(row => row.integration_key).map(row => [row.integration_key as string, row]));\n\n  for (const mandante of mandantes) {\n    const existing = backendByKey.get(mandante.id);\n    if (existing) {\n      await patchRows('mandantes', token, { integration_key: `eq.${mandante.id}` }, {\n        name: mandante.nombre,\n        rut: mandante.rut || null,\n        legal_name: mandante.nombre,\n        is_active: true,\n        updated_at: new Date().toISOString(),\n      });\n    } else {\n      await insertRows('mandantes', token, {\n        integration_key: mandante.id,\n        name: mandante.nombre,\n        rut: mandante.rut || null,\n        legal_name: mandante.nombre,\n        is_active: true,\n      }, 'integration_key');\n    }\n  }\n}\n\n'''
              if marker not in s: raise SystemExit('syncContractors marker missing')
              s = s.replace(marker, fn + marker)

          old = """  const projects = readArray<Proyecto>('acredita_proyectos', PROYECTOS);\n  const contractors = readArray<Contratista>('acredita_contratistas', CONTRATISTAS);\n  const requirements = readArray<Requisito>('acredita_requisitos', []);\n  const rows = await fetchCoreRows(session._supabase.accessToken);\n\n  const contractorUuidByKey = await syncContractors(session, rows, projects, contractors);\n  const refreshedRows = await fetchCoreRows(session._supabase.accessToken);\n"""
          new = """  const mandantes = readArray<Mandante>('acredita_mandantes', MANDANTES);\n  const projects = readArray<Proyecto>('acredita_proyectos', PROYECTOS);\n  const contractors = readArray<Contratista>('acredita_contratistas', CONTRATISTAS);\n  const requirements = readArray<Requisito>('acredita_requisitos', []);\n  const rows = await fetchCoreRows(session._supabase.accessToken);\n\n  await syncMandantes(session, rows, mandantes);\n  const rowsAfterMandantes = await fetchCoreRows(session._supabase.accessToken);\n  const contractorUuidByKey = await syncContractors(session, rowsAfterMandantes, projects, contractors);\n  const refreshedRows = await fetchCoreRows(session._supabase.accessToken);\n"""
          if old in s:
              s = s.replace(old, new)
          elif new not in s:
              raise SystemExit('pushCoreDataToSupabase marker missing')
          p.write_text(s)
          PY
      - run: npm ci
      - name: Assert architecture
        run: |
          ! grep -RInE "start(Core|Operational)DataAutoSync|runtimeFingerprint|setInterval" src/data/supabaseCoreData.ts src/data/supabaseOperationalData.ts
          grep -q "requestBusinessPersistence('all')" src/data/localStorageDb.ts
          grep -q "requestBusinessPersistence('core')" src/data/localStorageDb.ts
          grep -q "async function syncMandantes" src/data/supabaseCoreData.ts
      - name: Test direct writes and zero polling
        run: |
          cat > event-driven-test.ts <<'TS'
          class StorageMock {
            data = new Map<string, string>();
            getItem(k: string) { return this.data.get(k) ?? null; }
            setItem(k: string, v: string) { this.data.set(k, String(v)); }
            removeItem(k: string) { this.data.delete(k); }
            clear() { this.data.clear(); }
            key(i: number) { return [...this.data.keys()][i] ?? null; }
            get length() { return this.data.size; }
          }
          const storage = new StorageMock();
          (globalThis as any).window = globalThis;
          (globalThis as any).localStorage = storage;
          storage.setItem('acredita_session', JSON.stringify({ email: 'test@acredita.cl', role: 'admin', profileId: 'profile-test', _supabase: { accessToken: 'token-test', refreshToken: 'refresh-test', expiresAt: Date.now() + 3600000 } }));

          const writes: Array<{ url: string; method: string }> = [];
          const backend: Record<string, any[]> = {
            mandantes: [], projects: [],
            contratistas: [{ id: 'c-uuid', name: 'Contratista Test', rut: '2-7', integration_key: 'c-test', is_active: true }],
            accreditations: [], requirements: [], workers: [], worker_assignments: [], documents: [], document_versions: [],
            v_accreditation_state: [], v_worker_accreditation_state: []
          };
          let seq = 1;
          (globalThis as any).fetch = async (input: any, init: any = {}) => {
            const url = String(input); const method = String(init.method || 'GET').toUpperCase();
            const table = url.match(/\/rest\/v1\/([^?]+)/)?.[1] || '';
            if (method !== 'GET') writes.push({ url, method });
            if (method === 'GET') return new Response(JSON.stringify(backend[table] || []), { status: 200, headers: { 'Content-Type': 'application/json' } });
            if (method === 'POST') {
              const raw = JSON.parse(init.body || '{}');
              const items = Array.isArray(raw) ? raw : [raw];
              for (const item of items) backend[table] = [...(backend[table] || []), { id: `${table}-${seq++}`, ...item }];
            }
            return new Response(null, { status: 204 });
          };

          const db = await import('./src/data/localStorageDb.ts');
          const persistence = await import('./src/data/supabasePersistence.ts');
          db.saveMandantes([{ id: 'm-new', nombre: 'Mandante Event Driven', rut: '11.111.111-1', proyectos: [] }]);
          db.saveProyectos([{ id: 'p-new', nombre: 'Proyecto Event Driven', mandanteId: 'm-new', estado: 'Activo', contratistas: [] }]);
          db.saveContratistas([{ id: 'c-test', nombre: 'Contratista Test', rut: '2-7', proyectos: [], documentos: [], trabajadores: [] }]);
          await persistence.flushBusinessPersistence();

          if (!writes.some(w => w.method === 'POST' && w.url.includes('/rest/v1/mandantes'))) throw new Error('saveMandantes no persistió directamente');
          if (!writes.some(w => w.method === 'POST' && w.url.includes('/rest/v1/projects'))) throw new Error('saveProyectos no persistió directamente');
          if (!writes.some(w => w.method === 'PATCH' && w.url.includes('/rest/v1/contratistas'))) throw new Error('saveContratistas no persistió directamente');
          const count = writes.length;
          await new Promise(r => setTimeout(r, 1200));
          if (writes.length !== count) throw new Error('Aparecieron escrituras periódicas después del evento');
          console.log(`PASS: mandante+proyecto+contratista directos; ${count} escrituras; polling=0`);
          TS
          npx esbuild event-driven-test.ts --bundle --platform=node --format=esm --outfile=/tmp/event-driven-test.mjs --define:import.meta.env='{}'
          node /tmp/event-driven-test.mjs
          rm event-driven-test.ts
      - name: Typecheck modified files
        run: |
          npx tsc --noEmit > /tmp/tsc.log 2>&1 || true
          if grep -E "src/(components/ProtectedRoute|data/(localStorageDb|supabaseAuth|supabaseCoreData|supabaseOperationalData|supabasePersistence))" /tmp/tsc.log; then
            echo 'TypeScript errors found in modified files'
            exit 1
          fi
      - name: Build
        run: npm run build
      - name: Commit validated source
        run: |
          if [ -n "$(git status --porcelain src)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src
            git commit -m "Persiste mandantes directamente en Supabase"
            git push origin HEAD:feat/event-driven-supabase-writes
          fi

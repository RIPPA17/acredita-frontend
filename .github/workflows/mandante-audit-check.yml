name: Mandante audit check
on:
  push:
    branches:
      - fix/mandante-final-audit
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply Mandante audit fixes
        run: |
          python3 scripts/fix_mandante_audit.py
          python3 scripts/fix_mandante_sidebar.py
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src
            git commit -m "Corrige flujos finales del portal Mandante"
            git push
          fi
      - name: Audit Mandante role boundaries and demo leftovers
        run: |
          echo '--- forbidden review actions ---'
          if grep -RniE "aprobarDocumento|rechazarDocumento|Aprobar documento|Rechazar documento" src/pages/Mandante.tsx src/pages/mandante src/components/ContractorInvitationModal.tsx; then
            echo 'Mandante review action found'
            exit 1
          fi
          echo '--- demo ids/copy ---'
          if grep -RniE "costanera|mackenna|Plan Pro · 3|3 proyectos activos" src/pages/Mandante.tsx src/pages/mandante; then
            echo 'Demo-specific Mandante content found'
            exit 1
          fi
          echo '--- real document opening ---'
          grep -q "openDocumentFile" src/pages/mandante/ContratistasTab.tsx
          grep -q "solo lectura" src/pages/mandante/ContratistasTab.tsx
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm audit --omit=dev

name: Landing Point 5

on:
  push:
    branches:
      - fix/landing-access-cta

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/landing-access-cta
      - name: Ajustar mensajes de acceso
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/pages/Landing.tsx')
          t = p.read_text()
          replacements = [
              ('>Registrarse gratis</Link>', '>Solicitar acceso</Link>'),
              ('>Comenzar gratis</Link>', '>Solicitar acceso</Link>'),
              ('Empieza gratis hoy. Sin tarjeta de crédito. Sin compromiso. El contratista siempre entra gratis.', 'Solicita acceso para tu organización. Nuestro equipo revisará la solicitud y te contactará para habilitar la cuenta correspondiente.'),
              ('¿No tienes una cuenta? <Link to="/registro" className="text-brown font-medium hover:underline">Regístrate gratis</Link>', '¿Aún no tienes acceso? <Link to="/registro" className="text-brown font-medium hover:underline">Solicítalo aquí</Link>'),
          ]
          for old, new in replacements:
              if old not in t:
                  raise SystemExit(f'No se encontró el texto esperado: {old}')
              t = t.replace(old, new)
          for forbidden in ['Registrarse gratis', 'Comenzar gratis', 'Regístrate gratis', 'Sin tarjeta de crédito']:
              if forbidden in t:
                  raise SystemExit(f'Quedó copy engañoso: {forbidden}')
          p.write_text(t)
          PY
      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/Landing.tsx
          git commit -m "Alinea CTA de Landing con solicitud de acceso"
          git push origin HEAD:fix/landing-access-cta

name: Cleanup audit
on:
  push:
    branches:
      - cleanup/legacy-final

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply cleanup patches
        run: |
          python3 scripts/cleanup_legacy_patch.py
          python3 scripts/cleanup_legacy_phase2.py
          python3 scripts/cleanup_legacy_phase3.py
          python3 scripts/cleanup_legacy_phase4.py
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src tsconfig.json
            git commit -m "Retira flujos locales obsoletos"
            git push
          fi
      - name: Install
        run: npm ci
      - name: Apply safe dependency fixes
        run: |
          npm audit fix
          if ! git diff --quiet -- package.json package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package.json package-lock.json
            git commit -m "Actualiza dependencias vulnerables"
            git push
          fi
      - name: LocalStorage references
        run: |
          echo '=== LOCALSTORAGE REFERENCES (PRODUCT, NO TESTS) ==='
          grep -RIn --exclude-dir=node_modules --exclude-dir=__tests__ --exclude='*.css' 'localStorage\.' src || true
      - name: TypeScript
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Production dependency audit
        run: npm audit --omit=dev

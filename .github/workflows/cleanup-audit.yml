name: Cleanup audit
on:
  push:
    branches:
      - cleanup/legacy-final

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply cleanup patches
        run: |
          python3 scripts/cleanup_legacy_patch.py
          python3 scripts/cleanup_legacy_phase2.py
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src tsconfig.json
            git commit -m "Retira bootstrap y login local legacy"
            git push
          fi
      - name: Install
        run: npm ci
      - name: LocalStorage references
        run: |
          echo '=== LOCALSTORAGE REFERENCES (PRODUCT, NO TESTS) ==='
          grep -RIn --exclude-dir=node_modules --exclude-dir=__tests__ --exclude='*.css' 'localStorage\.' src || true
      - name: LocalStorageDb imports
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          imported=set()
          for p in Path('src').rglob('*'):
              if p.suffix not in {'.ts','.tsx'} or p.name=='localStorageDb.ts' or '__tests__' in p.parts: continue
              text=p.read_text(errors='ignore')
              for m in re.finditer(r'import\s*\{([^}]*)\}\s*from\s*[\"\']([^\"\']*localStorageDb)[\"\']', text, re.S):
                  for raw in m.group(1).split(','):
                      name=raw.strip().split(' as ')[0].strip()
                      if name: imported.add(name)
          print('COUNT', len(imported))
          for name in sorted(imported): print(name)
          PY
      - name: TypeScript
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Dependency audit
        continue-on-error: true
        run: npm audit --omit=dev

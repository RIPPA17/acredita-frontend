name: Point 9 Remove Mock Data

on:
  push:
    branches:
      - fix/remove-mock-data

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/remove-mock-data
      - name: Limpiar datos demo
        run: python .github/scripts/point9_remove_mock_data.py
      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A src/data
          git commit -m "Elimina datos ficticios del bundle"
          git push origin HEAD:fix/remove-mock-data

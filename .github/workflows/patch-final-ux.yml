name: Patch final UX branch

on:
  push:
    branches:
      - ux/final-ux-close2

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux/final-ux-close
      - name: Align UX routes and E2E expectations
        run: |
          python - <<'PY'
          from pathlib import Path

          hook = Path('src/hooks/usePortalTab.ts')
          text = hook.read_text()
          if "operacion: 'operacion'" not in text:
              text = text.replace("      trabajadores: 'trabajadores',", "      trabajadores: 'trabajadores'," + chr(10) + "      operacion: 'operacion',", 1)
          hook.write_text(text)

          critical = Path('tests/e2e/critical-flows.spec.ts')
          text = critical.read_text()
          text = text.replace("test('02 login expone los tres perfiles de acceso'", "test('02 login único detecta el portal y mantiene solicitudes de acceso'", 1)
          text = text.replace("await expect(page.getByRole('button', { name: 'Mandante' })).toBeVisible();", "await expect(page.getByRole('link', { name: 'Soy Mandante' })).toBeVisible();", 1)
          text = text.replace("await expect(page.getByRole('button', { name: 'Contratista' })).toBeVisible();", "await expect(page.getByRole('link', { name: 'Soy Contratista' })).toBeVisible();", 1)
          text = text.replace("await expect(page.getByRole('button', { name: 'Acredita' })).toBeVisible();", "await expect(page.getByText(/detectará automáticamente tu organización, perfil y permisos/i)).toBeVisible();", 1)
          text = text.replace("test('10 Contratista puede abrir Mis proyectos'", "test('10 Contratista puede abrir Proyectos'", 1)
          text = text.replace("await page.getByText('Mis proyectos', { exact: true }).first().click();", "await page.getByText('Proyectos', { exact: true }).first().click();", 1)
          critical.write_text(text)

          pilot = Path('tests/e2e/pilot-readiness.spec.ts')
          text = pilot.read_text()
          text = text.replace("page.getByLabel('Email').fill('usuario@empresa.cl')", "page.getByLabel('Correo electrónico').fill('usuario@empresa.cl')", 1)
          pilot.write_text(text)
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/hooks/usePortalTab.ts tests/e2e/critical-flows.spec.ts tests/e2e/pilot-readiness.spec.ts
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "fix: alinear navegación y pruebas con UX final"
          git push origin HEAD:ux/final-ux-close

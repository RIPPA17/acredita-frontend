name: Event-driven persistence patch v2

on:
  push:
    branches:
      - 'feat/event-driven-supabase-writes'

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply event-driven persistence patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          root = Path('.')

          p = root / 'src/data/supabaseAuth.ts'
          s = p.read_text()
          if 'getSupabaseSessionForRequest' not in s:
              marker = "export function clearSupabaseSession(): void {\n"
              insert = """export function getStoredSupabaseSession(): SupabaseUserSession | null {\n  return readStoredSession();\n}\n\nexport async function getSupabaseSessionForRequest(\n  sessionHint?: SupabaseUserSession | null,\n): Promise<SupabaseUserSession | null> {\n  const stored = sessionHint || readStoredSession();\n  if (!stored) return null;\n  if (stored._supabase.expiresAt > Date.now() + 60_000) return stored;\n  try {\n    const refreshed = toRawTokens(await refreshGrant(stored._supabase.refreshToken));\n    const next: SupabaseUserSession = { ...stored, _supabase: refreshed };\n    const current = readStoredSession();\n    if (current?.profileId === stored.profileId) persistSession(next);\n    return next;\n  } catch {\n    const current = readStoredSession();\n    if (current?.profileId === stored.profileId) localStorage.removeItem(SESSION_KEY);\n    return null;\n  }\n}\n\n"""
              if marker not in s: raise SystemExit('auth marker missing')
              p.write_text(s.replace(marker, insert + marker))

          p = root / 'src/data/supabasePersistence.ts'
          p.write_text("""import type { SupabaseUserSession } from './supabaseAuth';\nimport { getStoredSupabaseSession, getSupabaseSessionForRequest } from './supabaseAuth';\nimport { pushCoreDataToSupabase } from './supabaseCoreData';\nimport { pushOperationalDataToSupabase } from './supabaseOperationalData';\nimport { refreshDerivedStateCache } from './supabaseDerivedState';\n\nexport type BusinessPersistenceScope = 'core' | 'operational' | 'all';\n\nlet wantsCore = false;\nlet wantsOperational = false;\nlet scheduled = false;\nlet pendingSession: SupabaseUserSession | null = null;\nlet writeChain: Promise<void> = Promise.resolve();\nlet lastPersistenceError: unknown = null;\n\nasync function persistBatch(core: boolean, operational: boolean, sessionHint: SupabaseUserSession | null): Promise<void> {\n  const session = await getSupabaseSessionForRequest(sessionHint);\n  if (!session) return;\n  if (core) await pushCoreDataToSupabase(session);\n  if (operational) await pushOperationalDataToSupabase(session);\n  if (core || operational) await refreshDerivedStateCache(session);\n}\n\nfunction enqueuePendingBatch(): void {\n  const core = wantsCore;\n  const operational = wantsOperational;\n  const session = pendingSession;\n  wantsCore = false;\n  wantsOperational = false;\n  pendingSession = null;\n  if (!core && !operational) return;\n  writeChain = writeChain\n    .then(() => persistBatch(core, operational, session))\n    .catch((error) => {\n      lastPersistenceError = error;\n      console.error('Error persistiendo cambio de negocio en Supabase.', error);\n    });\n}\n\nexport function requestBusinessPersistence(scope: BusinessPersistenceScope): void {\n  if (typeof window === 'undefined') return;\n  const session = getStoredSupabaseSession();\n  if (!session) return;\n  if (pendingSession && pendingSession.profileId !== session.profileId) {\n    scheduled = false;\n    enqueuePendingBatch();\n  }\n  pendingSession = session;\n  if (scope === 'core' || scope === 'all') wantsCore = true;\n  if (scope === 'operational' || scope === 'all') wantsOperational = true;\n  if (scheduled) return;\n  scheduled = true;\n  Promise.resolve().then(() => {\n    if (!scheduled) return;\n    scheduled = false;\n    enqueuePendingBatch();\n  });\n}\n\nexport async function flushBusinessPersistence(): Promise<void> {\n  if (scheduled || wantsCore || wantsOperational) {\n    scheduled = false;\n    enqueuePendingBatch();\n  }\n  await writeChain;\n  if (lastPersistenceError) {\n    const error = lastPersistenceError;\n    lastPersistenceError = null;\n    throw error;\n  }\n}\n""")

          p = root / 'src/data/localStorageDb.ts'
          s = p.read_text()
          imp = "import { requestBusinessPersistence } from './supabasePersistence';\n"
          anchor = "import { clearRuntimeBusinessData, getRuntimeArray, setRuntimeArray } from './runtimeDataStore';\n"
          if imp not in s:
              if anchor not in s: raise SystemExit('localStorageDb import marker missing')
              s = s.replace(anchor, anchor + imp)
          pairs = [
            ("export function saveContratistas(data: Contratista[]) {\n  setRuntimeArray('acredita_contratistas', data);\n}", "export function saveContratistas(data: Contratista[]) {\n  setRuntimeArray('acredita_contratistas', data);\n  requestBusinessPersistence('all');\n}"),
            ("export function saveProyectos(data: Proyecto[]) {\n  setRuntimeArray('acredita_proyectos', data);\n}", "export function saveProyectos(data: Proyecto[]) {\n  setRuntimeArray('acredita_proyectos', data);\n  requestBusinessPersistence('core');\n}"),
            ("export function saveMandantes(data: Mandante[]) {\n  setRuntimeArray('acredita_mandantes', data);\n}", "export function saveMandantes(data: Mandante[]) {\n  setRuntimeArray('acredita_mandantes', data);\n  requestBusinessPersistence('core');\n}"),
            ("export function saveRequisitos(data: Requisito[]) {\n  setRuntimeArray('acredita_requisitos', data);\n}", "export function saveRequisitos(data: Requisito[]) {\n  setRuntimeArray('acredita_requisitos', data);\n  requestBusinessPersistence('core');\n}"),
          ]
          for old, new in pairs:
              if old in s: s = s.replace(old, new)
              elif new not in s: raise SystemExit('save marker missing')
          p.write_text(s)

          p = root / 'src/data/supabaseCoreData.ts'
          s = p.read_text()
          s = s.replace("import { getRuntimeArray, purgeLegacyBusinessStorage, runtimeFingerprint, setRuntimeArray } from './runtimeDataStore';", "import { getRuntimeArray, purgeLegacyBusinessStorage, setRuntimeArray } from './runtimeDataStore';")
          s = re.sub(r"\nconst CORE_KEYS = \['acredita_mandantes', 'acredita_proyectos', 'acredita_contratistas', 'acredita_requisitos'\] as const;\n", "\n", s)
          s = re.sub(r"\nfunction coreFingerprint\(\): string \{\n  return runtimeFingerprint\(CORE_KEYS\);\n\}\n", "\n", s)
          s = re.sub(r"\nexport function startCoreDataAutoSync\(session: SupabaseUserSession\): \(\) => void \{[\s\S]*?\n\}\s*$", "\n", s)
          p.write_text(s)

          p = root / 'src/data/supabaseOperationalData.ts'
          s = p.read_text()
          s = s.replace("import { getRuntimeArray, runtimeFingerprint, setRuntimeArray } from './runtimeDataStore';", "import { getRuntimeArray, setRuntimeArray } from './runtimeDataStore';")
          s = re.sub(r"\nfunction operationalFingerprint\(\): string \{\n  return runtimeFingerprint\(\[CONTRACTORS_KEY\]\);\n\}\n", "\n", s)
          s = re.sub(r"\nexport function startOperationalDataAutoSync\(session: SupabaseUserSession\): \(\) => void \{[\s\S]*?\n\}\s*$", "\n", s)
          p.write_text(s)

          p = root / 'src/components/ProtectedRoute.tsx'
          s = p.read_text()
          s = s.replace("import { prepareCoreDataForSession, startCoreDataAutoSync } from '../data/supabaseCoreData';", "import { prepareCoreDataForSession } from '../data/supabaseCoreData';")
          s = s.replace("import { prepareOperationalDataForSession, startOperationalDataAutoSync } from '../data/supabaseOperationalData';", "import { prepareOperationalDataForSession } from '../data/supabaseOperationalData';")
          s = re.sub(r"\n    let stopCoreSync = \(\) => \{\};\n    let stopOperationalSync = \(\) => \{\};", "", s)
          s = re.sub(r"\n    const startSyncForSession = \(current: SupabaseUserSession\) => \{[\s\S]*?\n    \};\n", "\n", s)
          s = s.replace("\n        startSyncForSession(restored);", "")
          s = s.replace("            stopCoreSync();\n            stopOperationalSync();\n", "")
          s = s.replace("          startSyncForSession(refreshed);\n", "")
          s = s.replace("      stopCoreSync();\n      stopOperationalSync();\n", "")
          s = s.replace("        // Mantiene viva la sesión en jornadas largas. Cuando cambia el token,\n        // reiniciamos ambos watchers para que todas las escrituras sigan\n        // pasando por RLS con el JWT vigente.", "        // Mantiene viva la sesión en jornadas largas. Las escrituras de negocio\n        // son event-driven y renuevan el JWT justo antes de persistir si hace falta.")
          p.write_text(s)
          PY
      - run: npm ci
      - name: Verify no business polling remains
        run: |
          ! grep -RInE "start(Core|Operational)DataAutoSync|runtimeFingerprint|setInterval" src/data/supabaseCoreData.ts src/data/supabaseOperationalData.ts
          grep -q "requestBusinessPersistence('all')" src/data/localStorageDb.ts
          grep -q "requestBusinessPersistence('core')" src/data/localStorageDb.ts
      - name: Verify event-driven write queue
        run: |
          cat > event-driven-test.ts <<'TS'
          class StorageMock {
            data = new Map<string, string>();
            getItem(k: string) { return this.data.get(k) ?? null; }
            setItem(k: string, v: string) { this.data.set(k, String(v)); }
            removeItem(k: string) { this.data.delete(k); }
            clear() { this.data.clear(); }
            key(i: number) { return [...this.data.keys()][i] ?? null; }
            get length() { return this.data.size; }
          }
          const storage = new StorageMock();
          (globalThis as any).window = globalThis;
          (globalThis as any).localStorage = storage;
          storage.setItem('acredita_session', JSON.stringify({ email: 'test@acredita.cl', role: 'admin', profileId: 'profile-test', _supabase: { accessToken: 'token-test', refreshToken: 'refresh-test', expiresAt: Date.now() + 3600000 } }));
          const writes: Array<{ url: string; method: string }> = [];
          const backend: Record<string, any[]> = {
            mandantes: [{ id: 'm-uuid', name: 'Mandante Test', rut: '1-9', integration_key: 'm-test', is_active: true }],
            projects: [],
            contratistas: [{ id: 'c-uuid', name: 'Contratista Test', rut: '2-7', integration_key: 'c-test', is_active: true }],
            accreditations: [], requirements: [], workers: [], worker_assignments: [], documents: [], document_versions: [],
            v_accreditation_state: [], v_worker_accreditation_state: []
          };
          (globalThis as any).fetch = async (input: any, init: any = {}) => {
            const url = String(input); const method = String(init.method || 'GET').toUpperCase();
            const table = url.match(/\/rest\/v1\/([^?]+)/)?.[1] || '';
            if (method !== 'GET') writes.push({ url, method });
            if (method === 'GET') return new Response(JSON.stringify(backend[table] || []), { status: 200, headers: { 'Content-Type': 'application/json' } });
            if (method === 'POST' && table === 'projects') backend.projects.push({ id: 'p-uuid', ...JSON.parse(init.body || '{}') });
            return new Response(null, { status: 204 });
          };
          const db = await import('./src/data/localStorageDb.ts');
          const persistence = await import('./src/data/supabasePersistence.ts');
          db.saveMandantes([{ id: 'm-test', nombre: 'Mandante Test', rut: '1-9', proyectos: [] }]);
          db.saveProyectos([{ id: 'p-test', nombre: 'Proyecto Event Driven', mandanteId: 'm-test', estado: 'Activo', contratistas: [] }]);
          db.saveContratistas([{ id: 'c-test', nombre: 'Contratista Test', rut: '2-7', proyectos: [], documentos: [], trabajadores: [] }]);
          await persistence.flushBusinessPersistence();
          if (!writes.some(w => w.method === 'POST' && w.url.includes('/rest/v1/projects'))) throw new Error('saveProyectos no disparó escritura directa');
          if (!writes.some(w => w.method === 'PATCH' && w.url.includes('/rest/v1/contratistas'))) throw new Error('saveContratistas no disparó escritura directa');
          const count = writes.length;
          await new Promise(r => setTimeout(r, 1200));
          if (writes.length !== count) throw new Error('Aparecieron escrituras periódicas después del flush');
          console.log(`PASS event-driven: ${count} escrituras, polling=0`);
          TS
          npx esbuild event-driven-test.ts --bundle --platform=node --format=esm --outfile=/tmp/event-driven-test.mjs --define:import.meta.env='{}'
          node /tmp/event-driven-test.mjs
          rm event-driven-test.ts
      - name: Typecheck modified files
        run: |
          npx tsc --noEmit > /tmp/tsc.log 2>&1 || true
          if grep -E "src/(components/ProtectedRoute|data/(localStorageDb|supabaseAuth|supabaseCoreData|supabaseOperationalData|supabasePersistence))" /tmp/tsc.log; then
            echo 'TypeScript errors found in modified files'
            exit 1
          fi
      - name: Build
        run: npm run build
      - name: Commit patch
        run: |
          if [ -n "$(git status --porcelain src)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src
            git commit -m "Elimina polling y persiste cambios por evento"
            git push origin HEAD:feat/event-driven-supabase-writes
          fi

name: Apply backend derived state

on:
  push:
    branches:
      - feat/backend-derived-state

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'Usa estados y auditoría oficiales de Supabase'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/backend-derived-state
          fetch-depth: 0
      - name: Patch frontend
        run: |
          python - <<'PY'
          from pathlib import Path

          def must_replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'No se encontró bloque esperado en {path}: {old[:100]}')
              p.write_text(text.replace(old, new, 1))

          # 1) Helper de estado de trabajador por proyecto/RUT para funciones legacy sin contratistaId.
          path = Path('src/data/supabaseDerivedState.ts')
          text = path.read_text()
          marker = "export async function refreshDerivedStateCache(session: SupabaseUserSession): Promise<void> {"
          if 'getBackendWorkerStateForProject' not in text:
              insert = '''export function getBackendWorkerStateForProject(\n  proyectoId: string,\n  trabajadorRut: string,\n): DerivedWorkerState | null {\n  const cache = readCache();\n  if (!cache) return null;\n  const suffix = `:${proyectoId}:${normalizeRut(trabajadorRut)}`;\n  const match = Object.entries(cache.workers || {}).find(([key]) => key.endsWith(suffix));\n  return match?.[1] || null;\n}\n\n'''
              if marker not in text: raise SystemExit('No se encontró marker derived state')
              text = text.replace(marker, insert + marker, 1)
              path.write_text(text)

          # 2) localStorageDb: backend tiene prioridad si existe cache hidratada.
          local = Path('src/data/localStorageDb.ts')
          text = local.read_text()
          types_import = "import { Contratista, Proyecto, Mandante, Documento, Trabajador, Requisito, Invitacion, HistorialVersionDocumento, Verificador, ClaimRevision, ActividadVerificador, PreferenciasNotificacionesContratista } from '../types';"
          derived_import = "import { backendAccreditationLabel, clearDerivedStateCache, getBackendAccreditationState, getBackendWorkerStateForProject } from './supabaseDerivedState';"
          if derived_import not in text:
              if types_import not in text: raise SystemExit('No se encontró import de types')
              text = text.replace(types_import, types_import + '\n' + derived_import, 1)

          worker_sig = "export function calcularEstadoTrabajador(w: Trabajador, proyectoId: string): 'aprobado' | 'por_vencer' | 'rechazado' | 'pendiente' {\n"
          worker_backend = '''export function calcularEstadoTrabajador(w: Trabajador, proyectoId: string): 'aprobado' | 'por_vencer' | 'rechazado' | 'pendiente' {\n  const backendState = getBackendWorkerStateForProject(proyectoId, w.rut);\n  if (backendState) {\n    if (backendState.status === 'aprobado') return backendState.nearExpiryCount > 0 ? 'por_vencer' : 'aprobado';\n    if (backendState.status === 'vencido_bloqueado') return 'rechazado';\n    return 'pendiente';\n  }\n'''
          if 'const backendState = getBackendWorkerStateForProject(proyectoId, w.rut);' not in text:
              if worker_sig not in text: raise SystemExit('No se encontró calcularEstadoTrabajador')
              text = text.replace(worker_sig, worker_backend, 1)

          old_worker_accredited = "export function esTrabajadorAcreditado(w: Trabajador, proyectoId: string): boolean {\n  return calcularEstadoTrabajador(w, proyectoId) === 'aprobado';\n}"
          new_worker_accredited = "export function esTrabajadorAcreditado(w: Trabajador, proyectoId: string): boolean {\n  const estado = calcularEstadoTrabajador(w, proyectoId);\n  return estado === 'aprobado' || estado === 'por_vencer';\n}"
          if old_worker_accredited in text:
              text = text.replace(old_worker_accredited, new_worker_accredited, 1)

          acc_sig = "export function calcularEstadoAcreditacion(c: Contratista, proyectoId: string): 'No acreditado' | 'En proceso' | 'Aprobado' | 'Vencido/Bloqueado' {\n"
          acc_backend = '''export function calcularEstadoAcreditacion(c: Contratista, proyectoId: string): 'No acreditado' | 'En proceso' | 'Aprobado' | 'Vencido/Bloqueado' {\n  const backendState = getBackendAccreditationState(c.id, proyectoId);\n  if (backendState) return backendAccreditationLabel(backendState);\n'''
          if 'if (backendState) return backendAccreditationLabel(backendState);' not in text:
              if acc_sig not in text: raise SystemExit('No se encontró calcularEstadoAcreditacion')
              text = text.replace(acc_sig, acc_backend, 1)

          access_sig = """export function calcularAccesoPago(c: Contratista, proyectoId: string): {\n  accesoEstado: EstadoCompuerta;\n  accesoBloqueado: boolean;\n  accesoPendiente: boolean;\n  motivoAcceso?: string;\n  pagoEstado: EstadoCompuerta;\n  pagoBloqueado: boolean;\n  pagoPendiente: boolean;\n  motivoPago?: string;\n} {\n"""
          access_backend = access_sig + '''  const backendState = getBackendAccreditationState(c.id, proyectoId);\n  if (backendState) {\n    const bloqueado = backendState.status === 'vencido_bloqueado';\n    const accesoPendiente = !backendState.accessAllowed && !bloqueado;\n    const pagoPendiente = !backendState.paymentAllowed && !bloqueado;\n    const motivo = bloqueado\n      ? 'Acreditación vencida o bloqueada según el estado oficial de Supabase'\n      : 'La acreditación todavía no está aprobada según el estado oficial de Supabase';\n    return {\n      accesoEstado: backendState.accessAllowed ? 'habilitado' : bloqueado ? 'bloqueado' : 'pendiente',\n      accesoBloqueado: bloqueado,\n      accesoPendiente,\n      motivoAcceso: backendState.accessAllowed ? undefined : motivo,\n      pagoEstado: backendState.paymentAllowed ? 'habilitado' : bloqueado ? 'bloqueado' : 'pendiente',\n      pagoBloqueado: bloqueado,\n      pagoPendiente,\n      motivoPago: backendState.paymentAllowed ? undefined : motivo,\n    };\n  }\n'''
          if 'Acreditación vencida o bloqueada según el estado oficial de Supabase' not in text:
              if access_sig not in text: raise SystemExit('No se encontró calcularAccesoPago')
              text = text.replace(access_sig, access_backend, 1)

          for fn in ['resetDemoData', 'limpiarDatosLocales', 'logoutUser']:
              sig = f'export function {fn}()'
              idx = text.find(sig)
              if idx == -1: continue
              brace = text.find('{', idx)
              if brace == -1: continue
              tail = text[brace:brace+180]
              if 'clearDerivedStateCache();' not in tail:
                  text = text[:brace+1] + '\n  clearDerivedStateCache();' + text[brace+1:]

          local.write_text(text)

          # 3) Cada hidratación operativa refresca también estado derivado del backend.
          op = Path('src/data/supabaseOperationalData.ts')
          text = op.read_text()
          type_import = "import type { SupabaseUserSession } from './supabaseAuth';"
          refresh_import = "import { refreshDerivedStateCache } from './supabaseDerivedState';"
          if refresh_import not in text:
              if type_import not in text: raise SystemExit('No se encontró import SupabaseUserSession')
              text = text.replace(type_import, type_import + '\n' + refresh_import, 1)
          target = "  writeContractors(next);\n}\n\nexport async function prepareOperationalDataForSession"
          replacement = "  writeContractors(next);\n  await refreshDerivedStateCache(session);\n}\n\nexport async function prepareOperationalDataForSession"
          if 'await refreshDerivedStateCache(session);' not in text:
              if target not in text: raise SystemExit('No se encontró final de hydrateOperationalDataFromSupabase')
              text = text.replace(target, replacement, 1)
          op.write_text(text)

          # 4) Admin Auditoría: fuente real desde Supabase, sin historial ilustrativo.
          admin = Path('src/pages/Admin.tsx')
          text = admin.read_text()
          audit_import_anchor = "import DocumentoDetailModal from './admin/DocumentoDetailModal';"
          audit_import = "import { loadSupabaseAuditLogs } from '../data/supabaseAuditData';"
          if audit_import not in text:
              if audit_import_anchor not in text: raise SystemExit('No se encontró anchor imports Admin')
              text = text.replace(audit_import_anchor, audit_import_anchor + '\n' + audit_import, 1)

          start = text.find('  const [auditoriaLogs, setAuditoriaLogs] = useState<any[]>(() => {')
          end = text.find('  const [showInvitarModal, setShowInvitarModal]', start)
          if start != -1 and end != -1:
              replacement = '''  const [auditoriaLogs, setAuditoriaLogs] = useState<any[]>([]);\n\n  useEffect(() => {\n    if (activeTab !== "auditoria") return;\n    let cancelled = false;\n    loadSupabaseAuditLogs()\n      .then((logs) => {\n        if (!cancelled) setAuditoriaLogs(logs);\n      })\n      .catch(() => {\n        if (cancelled) return;\n        const legacy = getAuditLogs().map(log => ({\n          ...log,\n          id: log.id,\n          accion: log.accion,\n          actor: log.actor || log.usuarioId,\n          rol: log.rol === 'admin' ? 'Revisor' : log.rol === 'contratista' ? 'Contratista' : log.rol === 'mandante' ? 'Mandante' : 'Sistema Automático',\n          empresa: log.empresa || 'N/A',\n          proyecto: log.proyecto || '',\n          detalle: log.detalle || '',\n          fecha: log.fecha || '',\n          resultado: log.resultado || 'informativo',\n        }));\n        setAuditoriaLogs(legacy);\n      });\n    return () => { cancelled = true; };\n  }, [activeTab]);\n\n'''
              text = text[:start] + replacement + text[end:]
          elif 'loadSupabaseAuditLogs()' not in text:
              raise SystemExit('No se encontró bloque auditoriaLogs Admin')
          admin.write_text(text)

          # 5) Vocabulario del Audit UI para acciones backend.
          aud = Path('src/pages/admin/AuditoriaTab.tsx')
          text = aud.read_text()
          anchor = "const ACCION_INFO: Record<string, { label: string; tipo: string; resultado: Resultado; badge: Badge }> = {\n"
          additions = '''  document_submitted: { label: 'Cargó documento', tipo: 'Documento', resultado: 'Pendiente', badge: 'amber' },\n  document_resubmitted: { label: 'Cargó nueva versión', tipo: 'Documento', resultado: 'Pendiente', badge: 'amber' },\n  document_approved: { label: 'Revisó documento', tipo: 'Documento', resultado: 'Aprobado', badge: 'green' },\n  document_rejected: { label: 'Rechazó documento', tipo: 'Documento', resultado: 'Rechazado', badge: 'red' },\n  document_review_updated: { label: 'Actualizó revisión', tipo: 'Documento', resultado: 'Actualizado', badge: 'blue' },\n  worker_assigned: { label: 'Asignó trabajador', tipo: 'Trabajador', resultado: 'Actualizado', badge: 'blue' },\n  worker_unassigned: { label: 'Desasignó trabajador', tipo: 'Trabajador', resultado: 'Actualizado', badge: 'gray' },\n  requirement_created: { label: 'Creó requisito', tipo: 'Requisito', resultado: 'Creado', badge: 'green' },\n  requirement_updated: { label: 'Actualizó requisito', tipo: 'Requisito', resultado: 'Actualizado', badge: 'blue' },\n  accreditation_created: { label: 'Creó acreditación', tipo: 'Acreditación', resultado: 'Creado', badge: 'green' },\n  accreditation_activated: { label: 'Activó acreditación', tipo: 'Acreditación', resultado: 'Actualizado', badge: 'green' },\n  accreditation_deactivated: { label: 'Desactivó acreditación', tipo: 'Acreditación', resultado: 'Bloqueado', badge: 'red' },\n'''
          if 'document_approved:' not in text:
              if anchor not in text: raise SystemExit('No se encontró ACCION_INFO')
              text = text.replace(anchor, anchor + additions, 1)
          aud.write_text(text)
          PY
      - name: Commit patched files
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/apply-backend-derived-state.yml
          git add src/data/supabaseDerivedState.ts src/data/supabaseOperationalData.ts src/data/localStorageDb.ts src/data/supabaseAuditData.ts src/pages/Admin.tsx src/pages/admin/AuditoriaTab.tsx
          git commit -m "Usa estados y auditoría oficiales de Supabase"
          git push origin feat/backend-derived-state

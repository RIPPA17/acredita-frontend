name: Inspect persistence

on:
  push:
    branches:
      - 'feat/event-driven-supabase-writes'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Find persistence callsites
        run: |
          echo '=== AUTO SYNC ==='
          rg -n "start(Core|Operational)DataAutoSync|setInterval" src || true
          echo '=== SAVE CALLS ==='
          rg -n "save(Contratistas|Proyectos|Mandantes|Requisitos)\(" src || true
          echo '=== IMPORTS OF SAVE FUNCTIONS ==='
          rg -n "saveContratistas|saveProyectos|saveMandantes|saveRequisitos" src || true

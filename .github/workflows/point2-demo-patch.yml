name: Point 2 Demo Patch

on:
  push:
    branches:
      - fix/real-demo-request

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/real-demo-request
      - name: Patch landing demo request
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/pages/Landing.tsx')
          text = path.read_text()

          old_import = "import { Link } from 'react-router-dom';"
          new_import = "import { Link } from 'react-router-dom';\nimport { SUPABASE_PUBLISHABLE_KEY, SUPABASE_URL } from '../data/supabaseAuth';"
          if old_import not in text:
              raise SystemExit('Landing import anchor not found')
          text = text.replace(old_import, new_import, 1)

          old_logic = """  const [demoForm, setDemoForm] = useState({ nombre: '', empresa: '', industria: '', correo: '', tamano: '', mensaje: '' });
          const [demoEnviado, setDemoEnviado] = useState(false);

          const handleSubmitDemo = (e: React.FormEvent) => {
            e.preventDefault();
            if (!demoForm.nombre.trim() || !demoForm.empresa.trim() || !demoForm.correo.trim()) return;
            setDemoEnviado(true);
            showToast('Solicitud enviada. Nuestro equipo te contactará pronto.');
          };"""

          new_logic = """  const [demoForm, setDemoForm] = useState({ nombre: '', empresa: '', industria: '', correo: '', tamano: '', mensaje: '' });
          const [demoEnviado, setDemoEnviado] = useState(false);
          const [demoEnviando, setDemoEnviando] = useState(false);

          const handleSubmitDemo = async (e: React.FormEvent) => {
            e.preventDefault();
            if (!demoForm.nombre.trim() || !demoForm.empresa.trim() || !demoForm.correo.trim() || demoEnviando) return;

            setDemoEnviando(true);
            try {
              const response = await fetch(`${SUPABASE_URL}/rest/v1/access_requests`, {
                method: 'POST',
                headers: {
                  apikey: SUPABASE_PUBLISHABLE_KEY,
                  'Content-Type': 'application/json',
                  Prefer: 'return=minimal',
                },
                body: JSON.stringify({
                  request_type: 'demo',
                  requested_role: 'mandante',
                  full_name: demoForm.nombre.trim(),
                  company_name: demoForm.empresa.trim(),
                  rut: null,
                  industry: demoForm.industria || null,
                  email: demoForm.correo.trim().toLowerCase(),
                  phone: null,
                  company_size: demoForm.tamano || null,
                  message: demoForm.mensaje.trim() || null,
                  status: 'pending',
                }),
              });

              if (!response.ok) {
                const payload = await response.json().catch(() => ({}));
                throw new Error(payload?.message || 'No fue posible enviar la solicitud.');
              }

              setDemoEnviado(true);
              showToast('Solicitud enviada. Nuestro equipo te contactará pronto.');
            } catch (error) {
              showToast(error instanceof Error ? error.message : 'No fue posible enviar la solicitud.', 'error');
            } finally {
              setDemoEnviando(false);
            }
          };"""

          if old_logic not in text:
              raise SystemExit('Landing demo logic anchor not found')
          text = text.replace(old_logic, new_logic, 1)

          old_button = '<button type="submit" className="btn btn-primary w-full justify-center text-[16.5px] py-3">Solicitar demo</button>'
          new_button = '<button type="submit" disabled={demoEnviando} className="btn btn-primary w-full justify-center text-[16.5px] py-3 disabled:opacity-60 disabled:cursor-not-allowed">{demoEnviando ? \'Enviando…\' : \'Solicitar demo\'}</button>'
          if old_button not in text:
              raise SystemExit('Landing demo submit button anchor not found')
          text = text.replace(old_button, new_button, 1)

          path.write_text(text)
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/Landing.tsx
          git commit -m "Conecta solicitud demo con Supabase"
          git push origin HEAD:fix/real-demo-request

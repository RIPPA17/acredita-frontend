name: E2E runtime store

on:
  push:
    branches:
      - 'feat/remove-business-localstorage'

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    env:
      PREVIEW_URL: https://acredita-frontend-pwrjkd9pp-roigppr-3548s-projects.vercel.app
      E2E_URL: https://jwlscxbmttpicwljozwf.supabase.co/functions/v1/acredita-browser-e2e-f4f87705
      E2E_KEY: 6S6DvDpIHS4LV2kdAnlpqNZ2tblR5ycrEb8FuQ-iK-E
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Create isolated Auth users
        shell: bash
        run: |
          curl --fail-with-body -sS -X POST "$E2E_URL" \
            -H 'Content-Type: application/json' \
            -H "x-test-key: $E2E_KEY" \
            -d '{"action":"bootstrap"}' > /tmp/e2e-users.json
          node -e "const x=require('/tmp/e2e-users.json'); if(!x.ok||x.users?.length!==3) { console.error(x); process.exit(1) }"
      - name: Verify all roles reload from Supabase
        shell: bash
        run: |
          cat > /tmp/runtime-store-e2e.mjs <<'JS'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          const preview = process.env.PREVIEW_URL;
          const users = JSON.parse(fs.readFileSync('/tmp/e2e-users.json','utf8')).users;
          const expected = { admin: '/admin', mandante: '/mandante', contratista: '/contratista' };
          const forbidden = ['acredita_contratistas','acredita_proyectos','acredita_mandantes','acredita_requisitos'];
          const browser = await chromium.launch();
          try {
            for (const user of users) {
              const context = await browser.newContext();
              const page = await context.newPage();
              const errors = [];
              page.on('pageerror', e => errors.push(`pageerror: ${e.message}`));
              page.on('console', m => { if (m.type() === 'error') errors.push(`console: ${m.text()}`) });
              await page.goto(`${preview}/login?rol=${user.role}`, { waitUntil: 'networkidle' });
              await page.locator('#login-email').fill(user.email);
              await page.locator('#login-password').fill(user.password);
              await page.getByRole('button', { name: 'Ingresar' }).click();
              await page.waitForURL(url => url.pathname.startsWith(expected[user.role]), { timeout: 30000 });
              await page.waitForLoadState('networkidle');
              const firstText = (await page.locator('body').innerText()).trim();
              if (firstText.length < 100) throw new Error(`${user.role}: portal sin contenido suficiente`);
              const keysBefore = await page.evaluate(() => Object.keys(localStorage));
              const leakedBefore = forbidden.filter(k => keysBefore.includes(k));
              if (leakedBefore.length) throw new Error(`${user.role}: claves de negocio persistidas antes de recarga: ${leakedBefore.join(', ')}`);
              if (!keysBefore.includes('acredita_session')) throw new Error(`${user.role}: falta sesión persistida`);

              await page.reload({ waitUntil: 'networkidle' });
              await page.waitForURL(url => url.pathname.startsWith(expected[user.role]), { timeout: 30000 });
              const secondText = (await page.locator('body').innerText()).trim();
              if (secondText.length < 100) throw new Error(`${user.role}: portal vacío después de recarga`);
              const keysAfter = await page.evaluate(() => Object.keys(localStorage));
              const leakedAfter = forbidden.filter(k => keysAfter.includes(k));
              if (leakedAfter.length) throw new Error(`${user.role}: claves de negocio persistidas después de recarga: ${leakedAfter.join(', ')}`);
              if (errors.some(e => e.includes('No fue posible preparar la sesión'))) throw new Error(`${user.role}: error preparando sesión: ${errors.join(' | ')}`);
              console.log(`PASS ${user.role}: ${expected[user.role]} | localStorage negocio=0 | reload=OK`);
              await context.close();
            }
          } finally {
            await browser.close();
          }
          JS
          node /tmp/runtime-store-e2e.mjs
      - name: Cleanup isolated Auth users
        if: always()
        shell: bash
        run: |
          curl --fail-with-body -sS -X POST "$E2E_URL" \
            -H 'Content-Type: application/json' \
            -H "x-test-key: $E2E_KEY" \
            -d '{"action":"cleanup"}'

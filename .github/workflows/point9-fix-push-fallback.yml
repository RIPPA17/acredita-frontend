name: Point 9 Fix Push Fallback

on:
  push:
    branches:
      - fix/remove-mock-data

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/remove-mock-data
      - name: Quitar fallbacks demo restantes
        run: python .github/scripts/point9_fix_push_fallback.py
      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/supabaseCoreData.ts
          git commit -m "Quita fallback demo de escritura core"
          git push origin HEAD:fix/remove-mock-data

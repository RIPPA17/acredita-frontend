name: Patch contractor onboarding
on:
  push:
    branches: [feat/contractor-onboarding]
    paths: [.onboarding-trigger]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/contractor-onboarding
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Replace legacy invitation modal
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/pages/Mandante.tsx')
          s = p.read_text()
          import_line = "import ContratistasTab from './mandante/ContratistasTab';\n"
          new_import = import_line + "import ContractorInvitationModal from '../components/ContractorInvitationModal';\n"
          if "ContractorInvitationModal" not in s:
              s = s.replace(import_line, new_import)
          start = s.find('      {showInvitarModal && (')
          if start < 0:
              raise SystemExit('legacy modal start not found')
          tail = s.rfind('\n    </div>\n  );\n}')
          if tail < 0 or tail <= start:
              raise SystemExit('component tail not found')
          replacement = '''      <ContractorInvitationModal
            open={showInvitarModal}
            onClose={() => setShowInvitarModal(false)}
            contractors={allContratistas}
            projects={misProyectos}
            showToast={showToast}
          />'''
          s = s[:start] + replacement + s[tail:]
          p.write_text(s)
          PY
      - name: Remove temporary workflow
        run: rm -f .github/workflows/patch-contractor-onboarding.yml .onboarding-trigger
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/Mandante.tsx .github/workflows/patch-contractor-onboarding.yml .onboarding-trigger
          git commit -m "Usa invitaciones reales desde el portal Mandante"
          git push origin HEAD:feat/contractor-onboarding

name: Point 8 URL Tabs

on:
  push:
    branches:
      - fix/url-tabs

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/url-tabs
      - name: Migrar pestañas principales a URL
        run: python .github/scripts/point8_url_tabs.py
      - name: Empaquetar archivos modificados
        uses: actions/upload-artifact@v4
        with:
          name: point8-url-tabs-files
          path: |
            src/pages/Admin.tsx
            src/pages/Mandante.tsx
            src/pages/Contratista.tsx

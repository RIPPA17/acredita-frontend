name: Admin audit check
on:
  push:
    branches:
      - fix/admin-final-audit
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply Admin audit fixes
        run: |
          python3 scripts/fix_admin_audit.py
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src
            git commit -m "Corrige flujos finales del portal Admin"
            git push
          fi
      - name: Audit Admin production paths
        run: |
          echo '--- no simulated dashboard metrics ---'
          ! grep -RniE "VERIFICADORES_HOY|VERIFICADORES_ACTIVOS|dynamicCola.length >= 3|useState\(2\)|useState\(1\)" src/pages/Admin.tsx src/pages/admin/DashboardTab.tsx || exit 1
          echo '--- no queue polling ---'
          ! grep -n "setInterval" src/pages/admin/ColaRevisionTab.tsx || exit 1
          echo '--- no fake Mandante invitation claims ---'
          ! grep -nE "¡Invitación enviada!|recibirá un link para activar su cuenta|Invitar Mandante" src/pages/Admin.tsx || exit 1
          echo '--- real contractor invitation from Admin ---'
          grep -q "ContractorInvitationModal" src/pages/Admin.tsx
          grep -q "session.role !== 'mandante' && session.role !== 'admin'" src/components/ContractorInvitationModal.tsx
          echo '--- obsolete global document modal detached ---'
          ! grep -Rni "DocumentoDetailModal" src/pages/Admin.tsx src/pages/admin --exclude='DocumentoDetailModal.tsx' || exit 1
          echo '--- no stale Storage/demo copy in active preview ---'
          ! grep -nE "conectar Supabase Storage|Documento demo / legacy|resto de la demo" src/pages/admin/DocumentPreview.tsx || exit 1
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm audit --omit=dev

name: Notifications check
on:
  push:
    branches:
      - feat/real-notifications
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply notification patches
        run: |
          python3 scripts/patch_real_notifications.py
          python3 scripts/patch_role_notifications.py
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src
            git commit -m "Conecta notificaciones reales para todos los roles"
            git push
          fi
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm audit --omit=dev

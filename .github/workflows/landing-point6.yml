name: Landing Point 6

on:
  push:
    branches:
      - fix/landing-footer-cleanup

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/landing-footer-cleanup
      - name: Limpiar footer
        run: python .github/scripts/landing_point6.py
      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/Landing.tsx
          git commit -m "Limpia footer de enlaces no disponibles"
          git push origin HEAD:fix/landing-footer-cleanup

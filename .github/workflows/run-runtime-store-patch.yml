name: Run runtime store patch

on:
  push:
    branches:
      - 'feat/remove-business-localstorage'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/remove-business-localstorage
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Extract and run patch
        shell: bash
        run: |
          sed -n "/python - <<'PY'/,/^          PY$/p" .github/workflows/patch-runtime-store.yml | sed '1d;$d;s/^          //' > /tmp/runtime_patch.py
          python /tmp/runtime_patch.py
      - run: npm ci
      - name: Typecheck without adding new errors
        shell: bash
        run: |
          set +e
          npm run lint > /tmp/tsc.log 2>&1
          set -e
          cat /tmp/tsc.log
          grep -E "error TS" /tmp/tsc.log | grep -Ev "src/pages/contratista/SubirTab.tsx|supabase/functions/send-contractor-invitation/index.ts|supabase/functions/signup-contractor-invitation/index.ts" > /tmp/new-ts-errors.log || true
          if [ -s /tmp/new-ts-errors.log ]; then
            echo "Se detectaron errores TypeScript nuevos:" >&2
            cat /tmp/new-ts-errors.log >&2
            exit 1
          fi
      - run: npm run build
      - name: Commit validated migration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/patch-runtime-store.yml .github/workflows/run-runtime-store-patch.yml
          git add src/data/runtimeDataStore.ts src/data/localStorageDb.ts src/data/supabaseCoreData.ts src/data/supabaseOperationalData.ts src/components/ProtectedRoute.tsx
          git commit -m "Elimina localStorage como fuente de negocio"
          git push origin feat/remove-business-localstorage

name: Apply direct document review

on:
  push:
    branches:
      - feat/direct-document-review

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'Mueve revisión documental a Supabase'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/direct-document-review
          fetch-depth: 0
      - name: Patch frontend
        run: python .github/apply_direct_review.py
      - name: Commit patched files
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/apply-direct-review.yml .github/apply_direct_review.py
          git add src/data/supabaseDocumentStorage.ts src/data/supabaseOperationalData.ts src/pages/admin/ColaRevisionTab.tsx
          git commit -m "Mueve revisión documental a Supabase"
          git push origin feat/direct-document-review
